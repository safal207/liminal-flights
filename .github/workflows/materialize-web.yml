name: Materialize reviewed web preview
on:
  push:
    branches: [feat/cozy-responsive-web-v01]
    paths: ['.bundle/p3', '.github/workflows/materialize-web.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    if: github.ref == 'refs/heads/feat/cozy-responsive-web-v01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract frontend source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bundle/p1 .bundle/p2 .bundle/p3 | base64 --decode > /tmp/lf-web.tar.xz
          echo '5317b1e390b23ef639455c7ce45d34a5f8b0368b9ac3469028974dd38144fc53  /tmp/lf-web.tar.xz' | sha256sum -c -
          tar -tJf /tmp/lf-web.tar.xz | grep -E '^(/|.*/\.\./)' && exit 1 || true
          tar -xJf /tmp/lf-web.tar.xz
          test -f web/index.html
          test -f web/app.js
          test -f web/core.mjs
          test -f .github/workflows/web-ci.yml
          node --check web/app.js
          node --test web/tests/core.test.mjs
      - name: Commit only rendered source (leave archive for reproduction)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/
          if ! git diff --cached --quiet; then
            git commit -m "feat(web): add calm responsive flight search frontend"
            git push origin HEAD:feat/cozy-responsive-web-v01
          fi
